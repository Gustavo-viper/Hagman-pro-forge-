<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel administrativo</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: var(--bg); overscroll-behavior: auto; }
    .adm-top { background: var(--navy); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 5; }
    .adm-top b { font-size: 1.1rem; }
    .adm-top button { color: #cbd5e1; font-weight: 600; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .login { max-width: 380px; margin: 12vh auto 0; padding: 20px; }
    .nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; }
    .nav button { padding: 10px 16px; border-radius: 999px; background: #e2e8f0; font-weight: 700; color: #475569; white-space: nowrap; }
    .nav button.on { background: var(--navy); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .grid div { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .grid b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
    .grid span { font-size: .82rem; color: var(--muted); }
    .u { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .u img { width: 120px; height: 90px; object-fit: cover; border-radius: 10px; background: #e2e8f0; }
    .u .info { flex: 1; min-width: 200px; }
    .u .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .u .acts .btn { width: auto; }
    .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e2e8f0; color: #334155; }
    .tag.pending { background: #fef3c7; color: #92400e; } .tag.active { background: #dcfce7; color: #166534; } .tag.blocked { background: #fee2e2; color: #991b1b; }
    .set { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 14px; }
  </style>
</head>
<body>
  <div id="login" class="login" hidden>
    <h2 class="title">Painel administrativo</h2>
    <form id="loginForm">
      <label class="field"><span>Senha do administrador</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="loginErr"></p>
      <button class="btn dark" type="submit">Entrar</button>
    </form>
  </div>
  <div id="panel" hidden>
    <div class="adm-top"><b id="appName">Painel</b><button id="logout">Sair</button></div>
    <div class="wrap">
      <div class="nav" id="nav">
        <button data-tab="overview" class="on">Resumo</button>
        <button data-tab="drivers">Motoristas <span id="pendingBadge"></span></button>
        <button data-tab="passengers">Passageiros</button>
        <button data-tab="rides">Corridas</button>
        <button data-tab="settings">Tarifas e ajustes</button>
      </div>
      <div id="content"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
